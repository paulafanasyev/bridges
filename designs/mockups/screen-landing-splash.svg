<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="splashBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#16213E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0F3460;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="splashGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E94560;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#FFB703;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#457B9D;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="splashBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E94560;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#C1121F;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="splashBtn2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#457B9D;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1D3557;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="360" height="640" fill="url(#splashBg)"/>
  <!-- Glow effect -->
  <circle cx="180" cy="240" r="180" fill="url(#splashGlow)"/>
  <!-- Decorative elements -->
  <line x1="0" y1="100" x2="100" y2="100" stroke="#E94560" stroke-width="1" opacity="0.1"/>
  <line x1="260" y1="100" x2="360" y2="100" stroke="#457B9D" stroke-width="1" opacity="0.1"/>
  <circle cx="50" cy="140" r="2" fill="#FFB703" opacity="0.4"/>
  <circle cx="310" cy="130" r="1.5" fill="#A8DADC" opacity="0.3"/>
  <circle cx="330" cy="180" r="2" fill="#FFB703" opacity="0.3"/>
  <circle cx="30" cy="200" r="1" fill="#A8DADC" opacity="0.2"/>
  <!-- Brand Logo -->
  <text x="180" y="190" font-family="Arial" font-size="48" fill="#E94560" text-anchor="middle" opacity="0.8">♥</text>
  <!-- Stylized bridge curve -->
  <path d="M80 200 Q180 170 280 200" fill="none" stroke="#FFB703" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M100 208 Q180 188 260 208" fill="none" stroke="#457B9D" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <!-- App Name -->
  <text x="180" y="250" fill="#F1FAEE" font-family="Inter, sans-serif" font-size="28" font-weight="700" text-anchor="middle">双心 Bridge</text>
  <text x="180" y="275" fill="#A8DADC" font-family="Inter, sans-serif" font-size="14" text-anchor="middle" letter-spacing="1">Два Сердца</text>
  <!-- Tagline -->
  <text x="180" y="310" fill="#A8DADC" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Мост между сердцами · 心与心之间的桥梁</text>
  <text x="180" y="330" fill="#6C757D" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Voice translation · Dating · Cultural exchange</text>
  <!-- CTA Buttons -->
  <rect x="40" y="380" width="280" height="50" rx="25" fill="url(#splashBtn)"/>
  <text x="180" y="412" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Начать знакомства</text>
  <rect x="40" y="442" width="280" height="50" rx="25" fill="none" stroke="#457B9D" stroke-width="1.5"/>
  <text x="180" y="474" fill="#A8DADC" font-family="Inter, sans-serif" font-size="14" font-weight="500" text-anchor="middle">У меня уже есть аккаунт</text>
  <!-- Language toggle -->
  <rect x="120" y="510" width="120" height="30" rx="15" fill="#0F3460" opacity="0.6"/>
  <rect x="122" y="512" width="58" height="26" rx="13" fill="#E94560"/>
  <text x="151" y="530" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Рус</text>
  <text x="205" y="530" fill="#A8DADC" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">中文</text>
  <!-- Features row -->
  <text x="60" y="565" font-family="Arial" font-size="18" fill="#E94560" text-anchor="middle">🎤</text>
  <text x="180" y="565" font-family="Arial" font-size="18" fill="#FFB703" text-anchor="middle">♥</text>
  <text x="300" y="565" font-family="Arial" font-size="18" fill="#457B9D" text-anchor="middle">🌏</text>
  <text x="60" y="582" fill="#6C757D" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Голосовой перевод</text>
  <text x="180" y="582" fill="#6C757D" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Умный поиск</text>
  <text x="300" y="582" fill="#6C757D" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Культуры</text>
  <!-- Bottom text -->
  <text x="180" y="620" fill="#6C757D" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">Продолжая, вы принимаете Условия использования</text>
</svg>