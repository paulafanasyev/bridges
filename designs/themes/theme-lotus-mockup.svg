<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="lotusBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F7FBF5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F0F7ED;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lotusAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A8D5BA;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#C2E4CE;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lotusPetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8B4C8;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#F0CCDA;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  <rect width="360" height="640" fill="url(#lotusBg)"/>
  <rect x="0" y="0" width="360" height="44" fill="#A8D5BA" opacity="0.08"/>
  <text x="20" y="30" fill="#6B7D72" font-family="Inter, sans-serif" font-size="12">9:41</text>
  <!-- Lotus decorative element -->
  <ellipse cx="300" cy="70" rx="30" ry="12" fill="#E8B4C8" opacity="0.08"/>
  <ellipse cx="300" cy="70" rx="20" ry="8" fill="#F0CCDA" opacity="0.06"/>
  <ellipse cx="300" cy="70" rx="12" ry="5" fill="#A8D5BA" opacity="0.05"/>
  <ellipse cx="50" cy="350" rx="20" ry="8" fill="#A8D5BA" opacity="0.06"/>
  <ellipse cx="50" cy="350" rx="12" ry="5" fill="#E8B4C8" opacity="0.04"/>
  <!-- Header -->
  <text x="24" y="78" fill="#2D3D33" font-family="Inter, sans-serif" font-size="22" font-weight="700">双心 Bridge</text>
  <text x="24" y="98" fill="#6B7D72" font-family="Inter, sans-serif" font-size="11">Мост между сердцами</text>
  <!-- Profile viewing - Russian user -->
  <rect x="24" y="120" width="312" height="260" rx="18" fill="white" stroke="#A8D5BA" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Avatar -->
  <circle cx="100" cy="185" r="42" fill="#F0F7ED" stroke="#A8D5BA" stroke-width="2"/>
  <circle cx="100" cy="173" r="17" fill="#E8B4C8" opacity="0.3"/>
  <path d="M86 207 Q100 217 114 207" fill="none" stroke="#A8D5BA" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Info -->
  <text x="160" y="178" fill="#2D3D33" font-family="Inter, sans-serif" font-size="18" font-weight="600">Анастасия</text>
  <text x="160" y="196" fill="#6B7D72" font-family="Inter, sans-serif" font-size="12">27, Казань</text>
  <!-- Zodiac + Compatibility -->
  <rect x="160" y="210" width="60" height="22" rx="11" fill="rgba(232,180,200,0.15)"/>
  <text x="168" y="225" fill="#E8B4C8" font-family="Inter, sans-serif" font-size="10">♎ Весы</text>
  <text x="230" y="226" fill="#6B7D72" font-family="Inter, sans-serif" font-size="11">Совместимость:</text>
  <text x="310" y="226" fill="#A8D5BA" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="end">94%</text>
  <!-- Bio -->
  <text x="42" y="252" fill="#6B7D72" font-family="Inter, sans-serif" font-size="11">Люблю йогу, чайные церемонии</text>
  <text x="42" y="268" fill="#6B7D72" font-family="Inter, sans-serif" font-size="11">и изучаю китайскую культуру 🪷</text>
  <!-- Tags -->
  <rect x="42" y="284" width="56" height="24" rx="12" fill="rgba(168,213,186,0.15)"/>
  <text x="50" y="300" fill="#4A8C6A" font-family="Inter, sans-serif" font-size="10">🧘 Йога</text>
  <rect x="106" y="284" width="64" height="24" rx="12" fill="rgba(232,180,200,0.15)"/>
  <text x="114" y="300" fill="#D47A9A" font-family="Inter, sans-serif" font-size="10">🍵 Чай</text>
  <rect x="178" y="284" width="56" height="24" rx="12" fill="rgba(240,194,122,0.15)"/>
  <text x="186" y="300" fill="#C09850" font-family="Inter, sans-serif" font-size="10">📚 Китайский</text>
  <!-- Photo gallery strip -->
  <text x="24" y="408" fill="#2D3D33" font-family="Inter, sans-serif" font-size="14" font-weight="600">Фотографии</text>
  <rect x="24" y="420" width="72" height="72" rx="12" fill="#F0F7ED" stroke="#A8D5BA" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="104" y="420" width="72" height="72" rx="12" fill="#F0F7ED" stroke="#A8D5BA" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="184" y="420" width="72" height="72" rx="12" fill="#F0F7ED" stroke="#A8D5BA" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="264" y="420" width="72" height="72" rx="12" fill="#F0F7ED" stroke="#A8D5BA" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Voice call interface -->
  <rect x="24" y="510" width="312" height="56" rx="16" fill="url(#lotusAccent)" opacity="0.15"/>
  <circle cx="56" cy="538" r="20" fill="#A8D5BA"/>
  <text x="56" y="544" font-family="Arial" font-size="18" fill="#2D3D33" text-anchor="middle">🎤</text>
  <text x="88" y="532" fill="#2D3D33" font-family="Inter, sans-serif" font-size="13" font-weight="600">Голосовой перевод</text>
  <text x="88" y="550" fill="#6B7D72" font-family="Inter, sans-serif" font-size="10">Нажмите, чтобы говорить</text>
  <text x="310" y="542" font-family="Arial" font-size="20" fill="#2D3D33" text-anchor="end">▶</text>
  <!-- Bottom nav -->
  <rect x="0" y="580" width="360" height="60" fill="white" opacity="0.95"/>
  <text x="40" y="620" font-family="Arial" font-size="16" fill="#6B7D72" opacity="0.5" text-anchor="middle">♥</text>
  <text x="120" y="620" font-family="Arial" font-size="16" fill="#6B7D72" opacity="0.5" text-anchor="middle">🔍</text>
  <text x="200" y="620" font-family="Arial" font-size="16" fill="#6B7D72" opacity="0.5" text-anchor="middle">💬</text>
  <circle cx="300" cy="605" r="18" fill="#A8D5BA" opacity="0.2"/>
  <text x="300" y="612" font-family="Arial" font-size="14" fill="#A8D5BA" text-anchor="middle">👤</text>
</svg>