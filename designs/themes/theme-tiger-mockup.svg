<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="tigerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213E;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="tigerAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E94560;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF6B6B;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="tigerCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16213E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1A1A2E;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="360" height="640" fill="url(#tigerBg)"/>
  <!-- Status bar -->
  <rect x="0" y="0" width="360" height="44" fill="#0F3460" opacity="0.8"/>
  <text x="20" y="30" fill="#A8DADC" font-family="Inter, sans-serif" font-size="12" opacity="0.8">9:41</text>
  <!-- Tiger pattern stripes (subtle) -->
  <line x1="280" y1="60" x2="350" y2="55" stroke="#E94560" stroke-width="2" opacity="0.15"/>
  <line x1="270" y1="75" x2="355" y2="70" stroke="#E94560" stroke-width="3" opacity="0.1"/>
  <line x1="290" y1="90" x2="340" y2="85" stroke="#E94560" stroke-width="2" opacity="0.12"/>
  <!-- Header -->
  <text x="24" y="80" fill="#F1FAEE" font-family="Inter, sans-serif" font-size="22" font-weight="700">双心 Bridge</text>
  <text x="24" y="100" fill="#A8DADC" font-family="Inter, sans-serif" font-size="11">Мост между сердцами</text>
  <!-- Navigation dots -->
  <circle cx="24" cy="120" r="4" fill="#E94560"/>
  <circle cx="40" cy="120" r="3" fill="#A8DADC" opacity="0.4"/>
  <circle cx="56" cy="120" r="3" fill="#A8DADC" opacity="0.4"/>
  <circle cx="72" cy="120" r="3" fill="#A8DADC" opacity="0.4"/>
  <!-- Hero match card -->
  <rect x="24" y="140" width="312" height="200" rx="16" fill="url(#tigerCard)" stroke="#E94560" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Avatar placeholder -->
  <circle cx="100" cy="220" r="40" fill="#0F3460" stroke="#E94560" stroke-width="2"/>
  <circle cx="100" cy="212" r="16" fill="#E94560" opacity="0.3"/>
  <path d="M88 240 Q100 248 112 240" fill="none" stroke="#E94560" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Match info -->
  <text x="158" y="200" fill="#F1FAEE" font-family="Inter, sans-serif" font-size="18" font-weight="600">Анна, 24</text>
  <text x="158" y="220" fill="#A8DADC" font-family="Inter, sans-serif" font-size="12">莫斯科 · Студентка</text>
  <text x="158" y="236" fill="#FFB703" font-family="Inter, sans-serif" font-size="11">★ 85% совместимость</text>
  <!-- Compatibility bar -->
  <rect x="158" y="244" width="140" height="4" rx="2" fill="#0F3460"/>
  <rect x="158" y="244" width="119" height="4" rx="2" fill="url(#tigerAccent)"/>
  <!-- Tags -->
  <rect x="24" y="310" width="60" height="22" rx="11" fill="#E94560" opacity="0.2"/>
  <text x="34" y="325" fill="#E94560" font-family="Inter, sans-serif" font-size="10" font-weight="500">🐯 Тигр</text>
  <rect x="92" y="310" width="70" height="22" rx="11" fill="#457B9D" opacity="0.2"/>
  <text x="102" y="325" fill="#457B9D" font-family="Inter, sans-serif" font-size="10">📖 Китайский</text>
  <rect x="170" y="310" width="70" height="22" rx="11" fill="#2A9D8F" opacity="0.2"/>
  <text x="180" y="325" fill="#2A9D8F" font-family="Inter, sans-serif" font-size="10">🎵 Музыка</text>
  <!-- Action buttons -->
  <circle cx="120" cy="370" r="28" fill="#0F3460" stroke="#A8DADC" stroke-width="1.5" opacity="0.5"/>
  <text x="120" y="376" font-family="Arial" font-size="20" fill="#A8DADC" text-anchor="middle">✕</text>
  <circle cx="200" cy="370" r="32" fill="url(#tigerAccent)"/>
  <text x="200" y="376" font-family="Arial" font-size="24" fill="#FFF" text-anchor="middle">♥</text>
  <circle cx="280" cy="370" r="28" fill="#0F3460" stroke="#457B9D" stroke-width="1.5" opacity="0.5"/>
  <text x="280" y="376" font-family="Arial" font-size="18" fill="#457B9D" text-anchor="middle">★</text>
  <!-- Online users strip -->
  <text x="24" y="420" fill="#F1FAEE" font-family="Inter, sans-serif" font-size="14" font-weight="600">Сейчас онлайн</text>
  <circle cx="30" cy="448" r="16" fill="#0F3460" stroke="#E94560" stroke-width="1.5"/>
  <circle cx="70" cy="448" r="16" fill="#0F3460" stroke="#2A9D8F" stroke-width="1.5"/>
  <circle cx="110" cy="448" r="16" fill="#0F3460" stroke="#FFB703" stroke-width="1.5"/>
  <circle cx="150" cy="448" r="16" fill="#0F3460" stroke="#457B9D" stroke-width="1.5"/>
  <circle cx="190" cy="448" r="16" fill="#0F3460" stroke="#A8DADC" stroke-width="1.5"/>
  <text x="32" y="453" font-family="Arial" font-size="12" fill="#F1FAEE">...</text>
  <text x="72" y="453" font-family="Arial" font-size="12" fill="#F1FAEE">...</text>
  <text x="112" y="453" font-family="Arial" font-size="12" fill="#F1FAEE">...</text>
  <text x="152" y="453" font-family="Arial" font-size="12" fill="#F1FAEE">...</text>
  <text x="192" y="453" font-family="Arial" font-size="12" fill="#F1FAEE">...</text>
  <!-- Bottom nav -->
  <rect x="0" y="580" width="360" height="60" fill="#0F3460" opacity="0.9"/>
  <text x="40" y="620" font-family="Arial" font-size="18" fill="#E94560" text-anchor="middle">♥</text>
  <text x="120" y="620" font-family="Arial" font-size="16" fill="#A8DADC" opacity="0.6" text-anchor="middle">🔍</text>
  <text x="200" y="620" font-family="Arial" font-size="16" fill="#A8DADC" opacity="0.6" text-anchor="middle">💬</text>
  <text x="280" y="620" font-family="Arial" font-size="16" fill="#A8DADC" opacity="0.6" text-anchor="middle">👤</text>
</svg>