  <text x="200" y="612" font-family="Arial" font-size="18" fill="#F5F0E8" text-anchor="middle">💬</text>
  <text x="280" y="620" font-family="Arial" font-size="16" fill="#D4A017" text-anchor="middle">👤</text>
