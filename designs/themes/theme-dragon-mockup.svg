<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="dragonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0C1821;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1B2838;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="dragonAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B7E5A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#219E6D;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="dragonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A017;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#E8B830;stop-opacity:1"/>
