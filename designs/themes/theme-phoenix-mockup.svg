  <text x="72" y="462" font-family="Arial" font-size="24" fill="#E07A5F" text-anchor="middle">🎨</text>
  <text x="72" y="490" fill="#E0D0C0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Галерея</text>
  <rect x="132" y="430" width="96" height="80" rx="12" fill="#2A1B3D" stroke="#F4A261" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="180" y="462" font-family="Arial" font-size="24" fill="#F4A261" text-anchor="middle">📸</text>
  <text x="180" y="490" fill="#E0D0C0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Фото</text>
  <rect x="240" y="430" width="96" height="80" rx="12" fill="#2A1B3D" stroke="#7B4EA6" stroke-width="0.5" stroke-opacity="0.2"/>
  <text x="288" y="462" font-family="Arial" font-size="24" fill="#7B4EA6" text-anchor="middle">🎵</text>
  <text x="288" y="490" fill="#E0D0C0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Музыка</text>
