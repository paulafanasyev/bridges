  <text x="162" y="210" fill="#E07A5F" font-family="Inter, sans-serif" font-size="11">🎨 Художник · Фотограф</text>
  <!-- Bio -->
  <text x="24" y="250" fill="#E0D0C0" font-family="Inter, sans-serif" font-size="11">"Ищу человека, с которым можно</text>
  <text x="24" y="265" fill="#E0D0C0" font-family="Inter, sans-serif" font-size="11">исследовать мир и создавать красоту"</text>
