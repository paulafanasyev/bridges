  <path d="M280 80 Q300 60 310 80 Q320 100 300 110 Q290 100 280 80Z" fill="#E07A5F" opacity="0.08"/>
  <path d="M320 60 Q340 40 350 65 Q360 90 335 95 Q325 80 320 60Z" fill="#F4A261" opacity="0.06"/>
  <path d="M260 100 Q275 85 285 100 Q295 115 275 120 Q265 110 260 100Z" fill="#7B4EA6" opacity="0.06"/>
