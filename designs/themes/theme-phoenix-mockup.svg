  </defs>
  <rect width="360" height="640" fill="url(#phoenixBg)"/>
  <rect x="0" y="0" width="360" height="44" fill="#120A18" opacity="0.8"/>
  <text x="20" y="30" fill="#E0D0C0" font-family="Inter, sans-serif" font-size="12">9:41</text>
