<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640">
  <defs>
    <linearGradient id="phoenixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1124;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#2A1B3D;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1A1124;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="phoenixFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E07A5F;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#F4A261;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7B4EA6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="phoenixCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2A1B3D;stop-opacity:1"/>
